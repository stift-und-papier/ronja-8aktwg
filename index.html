<body data-zeit="morgen">

<!-- Himmelsstreifen hinter dem Kopfbereich (nur Deko) -->
<div class="himmel" aria-hidden="true">
  <div class="himmel-ebene himmel-morgen"><svg class="ding sonne-halb" width="96" height="96"><use href="#d-sonne"/></svg><svg class="ding w1" width="56" height="32"><use href="#d-wolke"/></svg><svg class="ding w2" width="56" height="32"><use href="#d-wolke"/></svg></div>
  <div class="himmel-ebene himmel-mittag"><svg class="ding sonne-hoch" width="48" height="48"><use href="#d-sonne"/></svg><svg class="ding w1" width="56" height="32"><use href="#d-wolke"/></svg><svg class="ding w3" width="56" height="32"><use href="#d-wolke"/></svg><svg class="ding w4" width="56" height="32"><use href="#d-wolke"/></svg></div>
  <div class="himmel-ebene himmel-abend"><svg class="ding mond" width="48" height="48"><use href="#d-mond"/></svg><svg class="ding s1" width="36" height="36"><use href="#d-stern"/></svg><svg class="ding f1" width="20" height="20"><use href="#d-funkel"/></svg><svg class="ding f2" width="20" height="20"><use href="#d-funkel"/></svg><svg class="ding s2" width="36" height="36"><use href="#d-stern"/></svg><svg class="ding f3" width="20" height="20"><use href="#d-funkel"/></svg></div>
</div>

<!-- ============================================================
     DEKO-VORHANG ("Wie heißt der Hund?")
     ACHTUNG: Das ist KEIN Passwortschutz! Die Antwort steht
     offen in script.js, und alle Inhalte stehen in dieser Datei.
     ============================================================ -->
<div class="vorhang" id="vorhang" hidden>
  <form class="vorhang-karte" id="vorhang-form" autocomplete="off">
    <svg class="vorhang-pfote" aria-hidden="true" width="56" height="48"><use href="#d-pfote"/></svg>
    <h2 id="vorhang-titel">Halt, kurze Türsteher-Frage!</h2>
    <label for="vorhang-eingabe" id="vorhang-frage">Auf wen passt du auf?</label>
    <input id="vorhang-eingabe" name="hundename" type="text" inputmode="text" autocapitalize="words" spellcheck="false">
    <p class="vorhang-hinweis" id="vorhang-hinweis" aria-live="polite"></p>
    <button type="submit" class="knopf">Rein da!</button>
  </form>
</div>

<div class="seite" id="seite">

  <!-- Zahnrad: öffnet den Bearbeiten-Dialog -->
  <button type="button" class="zahnrad" id="zahnrad" aria-label="Texte bearbeiten" title="Texte bearbeiten">
    <svg aria-hidden="true"><use href="#i-zahnrad"/></svg>
  </button>
