<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Suchmaschinen sollen die Seite nicht listen -->
  <meta name="robots" content="noindex, nofollow">
  <title>Ronjas Futterplan</title>
  <meta name="theme-color" content="#FFF7EC">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
</head>
<body data-zeit="morgen">

<!-- ============================================================
     HINTERGRÜNDE (nur Deko, werden von Screenreadern übersprungen)
     ============================================================ -->
<div class="hintergrund" aria-hidden="true">

  <!-- gemeinsame Filter: leicht "gemalte", wacklige Kanten -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="wackel" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4"/>
        <feDisplacementMap in="SourceGraphic" scale="16"/>
      </filter>
      <filter id="weich" x="-20%" y="-50%" width="140%" height="200%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <filter id="leuchten" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <!-- MORGEN: Sonnenaufgang, Pastell, Dunst -->
  <svg class="bg bg-morgen" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="himmel-morgen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#C9DCEC"/>
        <stop offset=".35" stop-color="#EAD6E0"/>
        <stop offset=".55" stop-color="#F8D6C4"/>
        <stop offset=".66" stop-color="#FCE6BF"/>
      </linearGradient>
    </defs>
    <rect width="1600" height="1000" fill="url(#himmel-morgen)"/>
    <circle cx="1080" cy="600" r="210" fill="#FFF3D6" opacity=".55" filter="url(#weich)"/>
    <circle cx="1080" cy="605" r="85" fill="#FFE2A8"/>
    <g fill="#FFF8F0" opacity=".9" filter="url(#wackel)">
      <path d="M220 300 q20-45 70-35 q25-40 80-20 q45-5 50 40 q35 10 20 40 h-210 q-40-5-10-25z"/>
      <path d="M1250 220 q15-35 55-28 q25-30 65-10 q40 0 35 35 q25 10 10 30 h-160 q-30-5-5-27z"/>
      <path d="M700 380 q10-25 40-20 q20-22 50-6 q30 2 25 26 h-115z" opacity=".8"/>
    </g>
    <path d="M0 610 q200-70 420-30 q220 40 420-20 q240-60 420 10 q200 50 340 10 V1000 H0z" fill="#C7D3B4" filter="url(#wackel)"/>
    <rect x="-100" y="560" width="1800" height="140" fill="#FFFFFF" opacity=".45" filter="url(#weich)"/>
    <g filter="url(#wackel)">
      <path d="M0 690 q260-80 560-30 q300 50 560-10 q260-55 480 0 V1000 H0z" fill="#A8C285"/>
      <circle cx="300" cy="640" r="42" fill="#E79A63"/><rect x="296" y="670" width="8" height="40" fill="#7A5638"/>
      <circle cx="355" cy="655" r="30" fill="#EDB64C"/><rect x="352" y="675" width="6" height="30" fill="#7A5638"/>
      <circle cx="1330" cy="650" r="36" fill="#E07F55"/><rect x="1326" y="675" width="8" height="34" fill="#7A5638"/>
      <path d="M0 800 q300-90 700-30 q350 50 600-20 q180-40 300-10 V1000 H0z" fill="#8DB26A"/>
    </g>
    <rect x="-100" y="680" width="1800" height="120" fill="#FFFFFF" opacity=".25" filter="url(#weich)"/>
    <g class="deko" data-art="morgen"></g>
  </svg>

  <!-- MITTAG: sonnige Blumenwiese mit großen Wolken -->
  <svg class="bg bg-mittag" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="himmel-mittag" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#86C9E3"/>
        <stop offset=".45" stop-color="#C6E7EE"/>
        <stop offset=".65" stop-color="#F4F2D6"/>
      </linearGradient>
    </defs>
    <rect width="1600" height="1000" fill="url(#himmel-mittag)"/>
    <circle cx="1450" cy="120" r="160" fill="#FFF6C8" opacity=".7" filter="url(#weich)"/>
    <g filter="url(#wackel)">
      <g fill="#FFFDF4">
        <circle cx="260" cy="330" r="90"/><circle cx="370" cy="280" r="120"/><circle cx="500" cy="320" r="95"/><circle cx="160" cy="380" r="70"/>
        <rect x="150" y="330" width="420" height="110" rx="55"/>
        <circle cx="1100" cy="260" r="80"/><circle cx="1210" cy="210" r="115"/><circle cx="1340" cy="250" r="90"/><circle cx="1430" cy="300" r="65"/>
        <rect x="1040" y="260" width="440" height="100" rx="50"/>
      </g>
      <g fill="#E6EEF0" opacity=".9">
        <rect x="170" y="400" width="390" height="40" rx="20"/>
        <rect x="1060" y="320" width="400" height="40" rx="20"/>
      </g>
      <g fill="#FFFDF4" opacity=".85">
        <circle cx="760" cy="200" r="40"/><circle cx="820" cy="180" r="55"/><circle cx="880" cy="205" r="40"/>
        <rect x="730" y="200" width="180" height="40" rx="20"/>
      </g>
    </g>
    <g filter="url(#wackel)">
      <path d="M0 640 q300-60 640-20 q300 30 560-20 q220-40 400 0 V1000 H0z" fill="#BBD67A"/>
      <circle cx="210" cy="600" r="38" fill="#E4974F"/><rect x="206" y="628" width="8" height="34" fill="#6E4A2E"/>
      <circle cx="1240" cy="585" r="44" fill="#E3B03A"/><rect x="1236" y="618" width="8" height="38" fill="#6E4A2E"/>
      <circle cx="1300" cy="600" r="30" fill="#D9714E"/><rect x="1297" y="620" width="6" height="30" fill="#6E4A2E"/>
      <path d="M0 720 q360-90 820-40 q400 40 780-30 V1000 H0z" fill="#A4C94A"/>
      <path d="M0 830 q400-60 820-10 q420 40 780-20 V1000 H0z" fill="#5E9C48"/>
    </g>
    <g class="deko" data-art="mittag"></g>
  </svg>

  <!-- ABEND: Dämmerung, Sterne, Mond, leuchtende Blumen -->
  <svg class="bg bg-abend" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="himmel-abend" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#121C45"/>
        <stop offset=".35" stop-color="#26357A"/>
        <stop offset=".52" stop-color="#5D6AAB"/>
        <stop offset=".62" stop-color="#E9A56E"/>
      </linearGradient>
      <mask id="mond-maske">
        <rect width="1600" height="1000" fill="#fff"/>
        <circle cx="1238" cy="208" r="40" fill="#000"/>
      </mask>
    </defs>
    <rect width="1600" height="1000" fill="url(#himmel-abend)"/>
    <g class="sterne"></g>
    <circle cx="1220" cy="220" r="80" fill="#FFF3C9" opacity=".25" filter="url(#weich)"/>
    <circle cx="1220" cy="220" r="42" fill="#FFF3C9" mask="url(#mond-maske)"/>
    <g filter="url(#wackel)">
      <path d="M0 520 q200 20 380 110 q120 50 260 70 L0 720z" fill="#24326A"/>
      <path d="M1600 500 q-220 30 -420 130 q-140 60 -300 80 L1600 720z" fill="#22305F"/>
      <path d="M560 640 q120-40 220-10 q100-30 220 10 V720 H560z" fill="#3B4C8A"/>
      <g fill="#16223A">
        <path d="M110 700 l35-150 l35 150z"/><path d="M170 700 l25-110 l25 110z"/><path d="M60 700 l20-90 l20 90z"/>
        <path d="M1420 700 l30-130 l30 130z"/><path d="M1480 700 l22-90 l22 90z"/>
      </g>
      <path d="M0 690 q400-40 800 0 q400 30 800-10 V1000 H0z" fill="#1E3A3F"/>
      <path d="M0 800 q420-50 820 0 q400 40 780-20 V1000 H0z" fill="#183034"/>
    </g>
    <g class="deko" data-art="abend"></g>
  </svg>
</div>

<!-- ============================================================
     DEKO-VORHANG ("Wie heißt der Hund?")
     ACHTUNG: Das ist KEIN Passwortschutz! Die Antwort steht
     offen in script.js, und alle Inhalte stehen in dieser Datei.
     ============================================================ -->
<div class="vorhang" id="vorhang" hidden>
  <form class="vorhang-karte" id="vorhang-form" autocomplete="off">
    <p class="vorhang-pfote" aria-hidden="true">🐾</p>
    <h2 id="vorhang-titel">Halt, kurze Türsteher-Frage!</h2>
    <label for="vorhang-eingabe" id="vorhang-frage">Auf wen passt du auf?</label>
    <input id="vorhang-eingabe" name="hundename" type="text" inputmode="text" autocapitalize="words" spellcheck="false">
    <p class="vorhang-hinweis" id="vorhang-hinweis" aria-live="polite"></p>
    <button type="submit" class="knopf">Rein da!</button>
  </form>
</div>

<div class="seite" id="seite">

  <!-- Zahnrad: öffnet den Bearbeiten-Dialog -->
  <button type="button" class="zahnrad" id="zahnrad" aria-label="Texte bearbeiten" title="Texte bearbeiten">
    <svg aria-hidden="true"><use href="#i-zahnrad"/></svg>
  </button>

  <!-- ============================================================
       KOPFBEREICH mit Ronja
       ============================================================ -->
  <header class="kopf karte">
    <div class="kopf-blob" aria-hidden="true"></div>
    <div class="ronja-buehne">
      <!-- Ronja: Gruppen einzeln animierbar (rute, koerper, kopf, ohren, lider, maul) -->
      <svg id="ronja" class="ronja" viewBox="0 0 400 420" role="img" aria-labelledby="ronja-titel ronja-beschreibung">
        <title id="ronja-titel">Ronja</title>
        <desc id="ronja-beschreibung">Gezeichnete Hündin Ronja sitzt fröhlich da: sandbraunes Fell, helle Brust und Pfoten, dunkle Schnauze und Maske um die Augen, große Stehohren und eine buschige Rute mit weißer Spitze.</desc>
        <!-- Stil: Farbflächen OHNE Umrandung, darüber lose, offene Linien (wie Pinselstriche).
             Farben: Fell #D69A5E · Rücken/Rute #C98A50 · Creme #F4E0C0 · Maske #8B5A3A · Schnauze #4E3A33 · Linien #4A2B2B -->
        <g>

          <!-- RUTE (Schäferhund-Rute mit weißer Spitze) -->
          <g id="rute">
            <path d="M156 352 C118 342 78 346 48 366 C30 378 30 400 50 404 C84 408 122 400 158 390 Z" fill="#C98A50"/>
            <path d="M56 364 C36 374 31 398 50 404 C62 400 67 384 63 367 Z" fill="#FFF8EE"/>
            <g fill="none" stroke="#4A2B2B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M154 349 C118 340 80 344 52 362"/>
              <path d="M40 374 C32 386 34 400 48 404 C80 408 118 401 148 393"/>
              <path d="M96 350 l-5 -8 l9 2"/>
              <path d="M74 355 l-3 -9 l8 4"/>
            </g>
          </g>

          <!-- KÖRPER -->
          <g id="koerper">
            <!-- Flächen -->
            <path d="M172 186 C146 216 124 258 114 302 C104 346 112 384 140 398 L300 398 C308 350 304 300 286 252 C276 224 264 204 250 192 Z" fill="#D69A5E"/>
            <path d="M170 196 C150 222 132 258 122 296 C140 276 160 268 178 270 C178 240 176 214 170 196 Z" fill="#C98A50"/>
            <path d="M138 398 C130 384 150 376 172 380 C196 384 206 392 204 398 Z" fill="#F4E0C0"/>
            <path d="M198 200 C188 236 192 270 204 296 l8 -9 l8 13 l9 -11 l9 12 l9 -13 l7 8 C266 262 266 230 254 200 Z" fill="#F4E0C0"/>
            <!-- Vorderbeine -->
            <path d="M210 296 C208 330 206 366 206 394 Q224 404 242 394 C242 364 242 330 244 300 Z" fill="#D69A5E"/>
            <path d="M264 290 C264 326 262 362 262 394 Q280 404 298 392 C296 360 292 324 290 286 Z" fill="#D69A5E"/>
            <path d="M206 374 C214 368 234 368 242 374 L242 394 Q224 404 206 394 Z" fill="#F4E0C0"/>
            <path d="M262 372 C270 366 290 366 297 372 L298 392 Q280 404 262 394 Z" fill="#F4E0C0"/>

            <!-- lose Linien -->
            <g fill="none" stroke="#4A2B2B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M170 190 C146 218 127 258 117 296"/>
              <path d="M114 316 C108 350 116 380 136 394"/>
              <path d="M124 304 C138 278 166 272 186 288 C210 306 214 346 208 378"/>
              <path d="M142 396 C136 386 154 378 172 381 C190 384 201 390 203 396"/>
              <path d="M252 194 C266 206 278 226 286 250"/>
              <path d="M210 300 C208 332 206 364 206 392"/>
              <path d="M243 306 C242 336 242 366 242 392"/>
              <path d="M264 296 C264 330 263 364 262 392"/>
              <path d="M290 290 C293 326 296 360 298 390"/>
              <path d="M206 396 Q224 404 242 396"/>
              <path d="M262 396 Q280 404 298 394"/>
            </g>
            <!-- Fell-Büschel und Zehen -->
            <g fill="none" stroke="#4A2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M200 214 l-9 6 l8 3"/>
              <path d="M198 238 l-8 4"/>
              <path d="M254 214 l9 5 l-8 4"/>
              <path d="M220 248 l6 6"/><path d="M238 262 l-6 6"/>
              <path d="M148 236 l-10 0 l6 -7"/>
              <path d="M136 262 l-9 2"/>
              <path d="M218 396 l0 -7"/><path d="M230 396 l0 -7"/>
              <path d="M274 396 l0 -7"/><path d="M286 395 l0 -7"/>
              <path d="M160 388 l0 -6"/><path d="M174 388 l0 -6"/>
            </g>
          </g>

          <!-- KOPF -->
          <g id="kopf">
            <!-- OHREN (große Stehohren) -->
            <g id="ohren">
              <g id="ohr-links">
                <path d="M160 120 C136 90 114 56 110 22 C146 30 184 56 204 88 Z" fill="#D69A5E"/>
                <path d="M112 26 C118 54 132 82 152 110 C134 84 120 56 112 26 Z" fill="#A86A3A"/>
                <path d="M164 104 C146 80 130 58 124 40 C150 50 176 68 190 88 Z" fill="#E6A587"/>
                <path d="M156 114 C134 86 114 56 110 22 C144 30 176 52 198 80" fill="none" stroke="#4A2B2B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
              <g id="ohr-rechts">
                <path d="M228 88 C248 56 286 30 322 22 C318 56 296 90 272 120 Z" fill="#D69A5E"/>
                <path d="M320 26 C314 56 300 84 280 110 C298 84 312 56 320 26 Z" fill="#A86A3A"/>
                <path d="M242 88 C260 68 284 50 308 40 C302 60 286 82 268 104 Z" fill="#E6A587"/>
                <path d="M234 80 C254 54 288 30 322 22 C318 54 298 88 276 114" fill="none" stroke="#4A2B2B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
            </g>

            <!-- Kopf-Fläche mit Wangenfell -->
            <path d="M148 134 C146 96 178 74 216 74 C254 74 286 96 284 134 C285 152 280 168 272 180 L284 187 L270 192 C262 200 250 206 236 210 L196 210 C182 206 170 198 162 192 L148 187 L160 180 C152 168 148 152 148 134 Z" fill="#D69A5E"/>

            <!-- dunkle Maske + Stirnstreifen -->
            <g fill="#8B5A3A">
              <path d="M164 140 C166 124 182 118 196 124 C206 130 206 148 196 154 C182 160 166 154 164 140 Z"/>
              <path d="M268 140 C266 124 250 118 236 124 C226 130 226 148 236 154 C250 160 266 154 268 140 Z"/>
              <path d="M208 132 C206 112 210 96 216 86 C222 96 226 112 224 132 Z"/>
            </g>

            <!-- Augen -->
            <circle cx="186" cy="139" r="9" fill="#2A1A14"/>
            <circle cx="246" cy="139" r="9" fill="#2A1A14"/>
            <circle cx="189" cy="135" r="3" fill="#FFF8EE"/>
            <circle cx="249" cy="135" r="3" fill="#FFF8EE"/>

            <!-- AUGENLIDER (zum Blinzeln, normalerweise unsichtbar) -->
            <g id="lider">
              <g class="lid"><ellipse cx="186" cy="139" rx="12" ry="11" fill="#8B5A3A"/><path d="M175 141 Q186 148 197 141" fill="none" stroke="#4A2B2B" stroke-width="3.5" stroke-linecap="round"/></g>
              <g class="lid"><ellipse cx="246" cy="139" rx="12" ry="11" fill="#8B5A3A"/><path d="M235 141 Q246 148 257 141" fill="none" stroke="#4A2B2B" stroke-width="3.5" stroke-linecap="round"/></g>
            </g>

            <!-- dunkle Schnauze -->
            <path d="M184 166 C184 150 200 144 216 144 C232 144 248 150 248 166 C250 188 236 202 216 202 C196 202 182 188 184 166 Z" fill="#4E3A33"/>

            <!-- rosa Wangen -->
            <ellipse cx="166" cy="172" rx="9" ry="5.5" fill="#F2A0A0" opacity=".9"/>
            <ellipse cx="266" cy="172" rx="9" ry="5.5" fill="#F2A0A0" opacity=".9"/>

            <!-- MAUL + ZUNGE (zum Hecheln) -->
            <g id="maul">
              <path id="maul-offen" d="M198 184 Q216 194 234 184 Q232 210 216 214 Q200 210 198 184 Z" fill="#6A2A2E"/>
              <path id="zunge" d="M205 200 Q216 194 227 200 Q229 216 216 222 Q203 216 205 200 Z" fill="#EE8E90"/>
              <path d="M198 184 Q216 195 234 184" fill="none" stroke="#4A2B2B" stroke-width="3.5" stroke-linecap="round"/>
            </g>

            <!-- Nase -->
            <path d="M203 164 C203 156 229 156 229 164 C229 172 220 177 216 177 C212 177 203 172 203 164 Z" fill="#24140F"/>
            <ellipse cx="210" cy="161" rx="3.5" ry="1.8" fill="#7A645A"/>

            <!-- lose Kopf-Linien und Wangenfell -->
            <g fill="none" stroke="#4A2B2B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M198 78 Q216 72 234 78"/>
              <path d="M149 124 C147 148 151 164 158 178"/>
              <path d="M160 182 l-11 5 l9 5"/>
              <path d="M283 126 C284 148 279 166 272 180"/>
              <path d="M272 184 l11 4 l-9 5"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <h1 id="seiten-titel">Ronjas Futterplan</h1>
    <p class="untertitel" id="seiten-untertitel"></p>
  </header>

  <!-- ============================================================
       TOGGLE Morgen / Mittag / Abend
       ============================================================ -->
  <nav class="umschalter" aria-label="Tageszeit wählen">
    <div role="tablist" aria-label="Tageszeit">
      <button role="tab" id="tab-morgen" aria-controls="panel-morgen" aria-selected="true" data-zeit="morgen">
        <svg aria-hidden="true"><use href="#i-sonne-auf"/></svg><span>Morgen</span>
      </button>
      <button role="tab" id="tab-mittag" aria-controls="panel-mittag" aria-selected="false" tabindex="-1" data-zeit="mittag">
        <svg aria-hidden="true"><use href="#i-sonne"/></svg><span>Mittag</span>
      </button>
      <button role="tab" id="tab-abend" aria-controls="panel-abend" aria-selected="false" tabindex="-1" data-zeit="abend">
        <svg aria-hidden="true"><use href="#i-mond"/></svg><span>Abend</span>
      </button>
    </div>
  </nav>

  <noscript><p class="karte">Bitte JavaScript einschalten, damit die Texte erscheinen.</p></noscript>

  <div class="raster">
    <!-- IMMER SICHTBAR: wird aus inhalte.js befüllt -->
    <aside class="wichtig karte" aria-labelledby="wichtig-titel">
      <h2 id="wichtig-titel"></h2>
      <ul id="wichtig-liste"></ul>
    </aside>

    <!-- Die drei Tageszeiten: Inhalte kommen aus inhalte.js -->
    <main class="inhalt">
      <section role="tabpanel" id="panel-morgen" aria-labelledby="tab-morgen" class="panel"></section>
      <section role="tabpanel" id="panel-mittag" aria-labelledby="tab-mittag" class="panel" hidden></section>
      <section role="tabpanel" id="panel-abend" aria-labelledby="tab-abend" class="panel" hidden></section>
    </main>
  </div>

  <footer class="fuss">
    <p id="seiten-fuss"></p>
  </footer>
</div>

<!-- ============================================================
     KLEINE ICONS (werden oben mit <use href="#..."> eingesetzt)
     ============================================================ -->
<!-- ============================================================
     BEARBEITEN-DIALOG (Zahnrad) – wird von editor.js befüllt
     ============================================================ -->
<dialog class="editor" id="editor" aria-labelledby="editor-titel">
  <div class="editor-kopf">
    <h2 id="editor-titel">Texte bearbeiten</h2>
    <button type="button" class="editor-zu" id="editor-zu" aria-label="Schließen">✕</button>
  </div>
  <div class="editor-inhalt" id="editor-inhalt"></div>
  <div class="editor-fuss">
    <p class="editor-info">Änderungen siehst du sofort, aber <strong>nur auf diesem Gerät</strong>. Damit alle sie sehen: <strong>Datei speichern</strong> und auf GitHub hochladen.</p>
    <div class="editor-knoepfe">
      <button type="button" class="knopf" id="editor-speichern">Datei speichern</button>
      <button type="button" class="knopf knopf-hell" id="editor-verwerfen">Änderungen verwerfen</button>
    </div>
  </div>
</dialog>

<!-- Hinweis, wenn ein Entwurf aktiv ist -->
<div class="entwurf-banner" id="entwurf-banner" hidden>
  <span>✏️ Entwurf – nur auf diesem Gerät sichtbar</span>
  <button type="button" id="banner-bearbeiten">Bearbeiten</button>
</div>

<!-- ============================================================
     ZEICHNUNG: Fnöt, Ronjas Stofftier
     ============================================================ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="handstrich" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="3.5"/>
    </filter>
    <!-- Pfotenabdruck zum Wiederverwenden -->
    <symbol id="pfote-klein" viewBox="-12 -12 24 24">
      <ellipse cx="0" cy="3" rx="5.5" ry="4.5"/><circle cx="-6" cy="-3" r="2.3"/><circle cx="-2.2" cy="-7" r="2.3"/><circle cx="2.2" cy="-7" r="2.3"/><circle cx="6" cy="-3" r="2.3"/>
    </symbol>

    <!-- NASSFUTTER-DOSE -->
    <symbol id="bild-dose" viewBox="0 0 230 160">
      <g filter="url(#handstrich)" stroke="#3B2418" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- aufgerollter Deckel -->
        <path d="M134 46 C150 28 150 6 132 6 C114 6 112 26 124 34" fill="#DCD6CC"/>
        <path d="M78 48 L78 132 Q115 148 152 132 L152 48 Q115 62 78 48 Z" fill="#DCD6CC"/>
        <path d="M78 64 Q115 78 152 64 L152 118 Q115 132 78 118 Z" fill="#D9714E" stroke-width="4"/>
        <ellipse cx="115" cy="48" rx="37" ry="11" fill="#DCD6CC"/>
        <ellipse cx="115" cy="49" rx="29" ry="7" fill="#9A5F3A" stroke-width="3.5"/>
